name: Repair App Syntax
on:
  push:
    paths:
      - '.github/workflows/debug-app-syntax.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify App syntax
        run: |
          npm ci
          npm run build
      - name: Report
        run: echo 'App syntax/build verified; no source mutation required.'
