name: Supplier Tracker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  supplier-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply supplier tracker
        run: python scripts/update_supplier_tracker.py
      - name: Apply percentage based parts selling price
        run: python scripts/add_parts_markup.py
      - name: Apply searchable POS and stock history
        run: python scripts/add_inventory_search.py
      - name: Apply Orders tab and organized navigation
        run: python scripts/add_orders_tab.py
      - name: Apply manual item support for Orders
        run: python scripts/add_order_manual_items.py
      - name: Apply Job Sheet delete fix
        run: python scripts/fix_jobsheet_delete.py
      - name: Apply dashboard graphs
        run: python scripts/dashboard_graphs.py
      - name: Commit application update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then echo "No application changes needed"; else git commit -m "feat: replace dashboard recent jobs with graphs"; git push; fi
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build

# Parts inventory SP is calculated from CP plus the entered markup percentage.
