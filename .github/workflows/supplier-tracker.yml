name: Supplier Tracker Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  supplier-tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply supplier tracker
        run: python scripts/update_supplier_tracker.py
      - name: Remove payment method GUI only
        run: python scripts/remove_payment_method_gui.py
      - name: Commit application update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then echo "No application changes needed"; else git commit -m "fix: remove payment method GUI only"; git push; fi
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build

# Payment Method GUI removed while payment status/data logic remains intact.
