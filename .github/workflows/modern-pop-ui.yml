name: Modern popup UI patch

on:
  push:
    paths:
      - '.github/workflows/modern-pop-ui.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch modern popups
        shell: python
        run: |
          from pathlib import Path
          p = Path('App.jsx')
          s = p.read_text(encoding='utf-8')

          old = "  const [invoiceFilterTab, setInvoiceFilterTab] = useState('All');"
          new = old + r'''\n\n  const [toast, setToast] = useState(null);\n  const [confirmDialog, setConfirmDialog] = useState(null);\n\n  const showToast = (message, type = 'success') => {\n    setToast({ message, type });\n    window.clearTimeout(window.__gfToastTimer);\n    window.__gfToastTimer = window.setTimeout(() => setToast(null), 2600);\n  };\n\n  const requestDelete = (title, message, onConfirm) => {\n    setConfirmDialog({ title, message, onConfirm });\n  };\n\n  const closeConfirm = () => setConfirmDialog(null);\n\n  const confirmDelete = () => {\n    if (confirmDialog?.onConfirm) confirmDialog.onConfirm();\n    setConfirmDialog(null);\n    showToast('Record deleted successfully.', 'success');\n  };'''
          if old in s and 'const [toast, setToast]' not in s:
              s = s.replace(old, new, 1)

          replacements = {
            "alert('Job Sheet सफलतापूर्वक Save भयो!');": "showToast('Job Sheet सफलतापूर्वक Save भयो!');",
            "alert('Device सफलतापूर्वक Save भयो!');": "showToast('Device सफलतापूर्वक Save भयो!');",
            "alert('Accessories Bill सफलतापूर्वक Save भयो!');": "showToast('Accessories Bill सफलतापूर्वक Save भयो!');",
          }
          for a,b in replacements.items(): s = s.replace(a,b)

          s = s.replace(
            "onClick={() => { if(window.confirm('के तपाईं यो रेकर्ड डिलेट गर्न चाहनुहुन्छ?')) deleteRepair(inv.id); }}",
            "onClick={() => requestDelete('Delete this record?', 'This invoice will be permanently removed from your local records.', () => deleteRepair(inv.id))}"
          )
          s = s.replace(
            "onClick={() => deleteDevice(dev.id)}",
            "onClick={() => requestDelete('Delete this device?', 'This device entry will be permanently removed from stock records.', () => deleteDevice(dev.id))}"
          )
          s = s.replace(
            "onClick={() => deletePart(item.id)}",
            "onClick={() => requestDelete('Delete this part?', 'This inventory item will be permanently removed from stock.', () => deletePart(item.id))}"
          )
          s = s.replace(
            "onClick={() => deleteExpense(exp.id)}",
            "onClick={() => requestDelete('Delete this expense?', 'This expense record will be permanently removed.', () => deleteExpense(exp.id))}"
          )

          marker = "      {/* INVOICE PREVIEW MODAL */}"
          ui = r'''      {/* MODERN TOAST + CONFIRM DIALOG */}\n      {toast && (\n        <div className="fixed top-5 right-5 z-[100] animate-in slide-in-from-right-5 fade-in duration-300">\n          <div className="flex min-w-[320px] max-w-[420px] items-center gap-3 rounded-2xl border border-slate-700/80 bg-[#151922]/95 px-4 py-3.5 text-white shadow-2xl shadow-black/30 backdrop-blur-xl">\n            <div className="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl bg-emerald-500/15 text-emerald-400">\n              <CheckCircle2 size={20} />\n            </div>\n            <div className="min-w-0 flex-1">\n              <p className="text-[11px] font-bold uppercase tracking-wider text-emerald-400">Success</p>\n              <p className="mt-0.5 text-sm font-semibold text-slate-100">{toast.message}</p>\n            </div>\n            <button onClick={() => setToast(null)} className="rounded-lg p-1.5 text-slate-500 transition hover:bg-white/5 hover:text-white">\n              <X size={16} />\n            </button>\n          </div>\n        </div>\n      )}\n\n      {confirmDialog && (\n        <div className="fixed inset-0 z-[110] flex items-center justify-center bg-black/65 p-4 backdrop-blur-sm animate-in fade-in duration-200">\n          <div className="w-full max-w-md overflow-hidden rounded-3xl border border-slate-700/80 bg-[#171B24] text-slate-100 shadow-2xl shadow-black/50 animate-in zoom-in-95 duration-200">\n            <div className="p-6">\n              <div className="flex items-start gap-4">\n                <div className="flex h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-rose-500/10 text-rose-400">\n                  <AlertTriangle size={23} />\n                </div>\n                <div className="flex-1">\n                  <h3 className="text-lg font-extrabold tracking-tight">{confirmDialog.title}</h3>\n                  <p className="mt-1.5 text-sm leading-6 text-slate-400">{confirmDialog.message}</p>\n                </div>\n                <button onClick={closeConfirm} className="rounded-xl p-2 text-slate-500 transition hover:bg-white/5 hover:text-white">\n                  <X size={18} />\n                </button>\n              </div>\n\n              <div className="mt-6 flex justify-end gap-2.5">\n                <button onClick={closeConfirm} className="rounded-xl border border-slate-700 bg-slate-800/60 px-4 py-2.5 text-xs font-bold text-slate-300 transition hover:bg-slate-700">\n                  Cancel\n                </button>\n                <button onClick={confirmDelete} className="rounded-xl bg-rose-600 px-4 py-2.5 text-xs font-bold text-white shadow-lg shadow-rose-600/20 transition hover:bg-rose-500 active:scale-[0.98]">\n                  Delete Record\n                </button>\n              </div>\n            </div>\n          </div>\n        </div>\n      )}\n\n'''
          if marker in s and 'MODERN TOAST + CONFIRM DIALOG' not in s:
              s = s.replace(marker, ui + marker, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add App.jsx
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "feat: modern save and delete popups"
          git push
