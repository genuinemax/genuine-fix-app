name: Fix popup JSX newlines

on:
  push:
    paths:
      - '.github/workflows/fix-popup-newlines.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair popup formatting in root App.jsx
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('App.jsx')
          s = p.read_text(encoding='utf-8')
          start = s.find("  const [toast, setToast] = useState(null);")
          if start == -1:
              raise SystemExit('toast block not found')
          end = s.find("      {/* INVOICE PREVIEW MODAL */}", start)
          if end == -1:
              raise SystemExit('invoice marker not found')
          block = s[start:end]
          block = block.replace('\\n', '\n')
          s = s[:start] + block + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App.jsx
          git diff --cached --quiet || git commit -m 'fix: repair modern popup JSX formatting'
          git push
