name: Genuine Fix Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply billing and supplier ledger updates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/App.jsx')
          s = p.read_text()
          original = s
          s = re.sub(r'\s*<div id="walk-in-bill-actions"[\s\S]*?</div>\s*', '\n', s, count=1)
          if 'item.nonStock' not in s:
              h = s.find('Bill Items & Parts Selection')
              a = s.find('<select', h)
              b = s.find('</select>', a) + len('</select>')
              old = s[a:b]
              new = '''{item.nonStock ? (<input type="text" value={item.name} onChange={e => { const n=[...posBill.items]; n[idx].name=e.target.value; setPosBill({...posBill,items:n}); }} placeholder="Non-stock item / service name" className={`flex-1 p-3 ${t.inputBg} border rounded-2xl text-sm`} required />) : (''' + old + ''')}
            <button type="button" onClick={() => { const n=[...posBill.items]; n[idx].nonStock=!n[idx].nonStock; if(n[idx].nonStock){n[idx].name='';n[idx].price='';} setPosBill({...posBill,items:n}); }} className={`px-3 py-2 rounded-xl text-xs font-black border ${item.nonStock ? 'bg-blue-600/20 text-blue-400' : 'bg-amber-600/20 text-amber-400'}`}>{item.nonStock ? 'Stock Item' : 'Non-stock'}</button>'''
              if h < 0 or a < 0 or b <= a: raise SystemExit('POS bill item selector not found')
              s = s[:a] + new + s[b:]
          s = s.replace('!invItem ||', 'invItem &&', 1)
          s = s.replace("items: [{ name: '', price: '', qty: 1 }]", "items: [{ name: '', price: '', qty: 1, nonStock: false }]")
          s = s.replace("items: [...posBill.items, { name: '', price: '', qty: 1 }]", "items: [...posBill.items, { name: '', price: '', qty: 1, nonStock: false }]")
          if 'supplierPeriodFilter' not in s:
              m = "  const [viewingExpenseDetails, setViewingExpenseDetails] = useState(null);"
              if m not in s: raise SystemExit('expense state marker not found')
              s = s.replace(m, m + "\n  const [supplierPeriodFilter, setSupplierPeriodFilter] = useState('month');\n  const [supplierMonthFilter, setSupplierMonthFilter] = useState(getLocalDateKey().slice(0, 7));", 1)
          if 'supplierLedgerRows' not in s:
              m = "  const totalSupplierDue = expenses.reduce((acc, curr) => acc + Number(curr.dueAmount || 0), 0);"
              code = "  const supplierLedgerRows = (() => { const now=new Date(); const ym=supplierMonthFilter||getLocalDateKey().slice(0,7); let start=new Date(`${ym}-01T00:00:00`); let end=new Date(start); if(supplierPeriodFilter==='week'){ const day=start.getDay(); start.setDate(start.getDate()+(day===0?-6:1-day)); end=new Date(start); end.setDate(end.getDate()+7); } else if(supplierPeriodFilter==='day'){ start=new Date(now.getFullYear(),now.getMonth(),now.getDate()); end=new Date(start); end.setDate(end.getDate()+1); } else { end.setMonth(end.getMonth()+1); } const map={}; expenses.filter(e=>e.supplierName&&e.supplierName!=='N/A'&&e.supplierName!=='Unknown Supplier').forEach(e=>{ const d=new Date(`${String(e.date||'').slice(0,10)}T00:00:00`); if(Number.isNaN(d.getTime())||d<start||d>=end)return; const k=e.supplierName.trim(); if(!map[k])map[k]={name:k,phone:e.supplierPhone||'',purchases:0,paid:0,due:0,entries:0}; map[k].purchases+=Number(e.amount!==undefined?e.amount:e.paidAmount||0); map[k].paid+=Number(e.paidAmount||0); map[k].due+=Number(e.dueAmount||0); map[k].entries++; }); return Object.values(map).sort((a,b)=>b.purchases-a.purchases); })();\n  const supplierPeriodPurchaseTotal=supplierLedgerRows.reduce((a,r)=>a+r.purchases,0);\n  const supplierPeriodPaidTotal=supplierLedgerRows.reduce((a,r)=>a+r.paid,0);\n  const supplierPeriodDueTotal=supplierLedgerRows.reduce((a,r)=>a+r.due,0);"
              if m not in s: raise SystemExit('supplier due metric marker not found')
              s = s.replace(m, m + "\n" + code, 1)
          if 'id="supplier-ledger-summary"' not in s:
              m = '            <form onSubmit={handleAddExpense}'
              ui = '''            <div id="supplier-ledger-summary" className="space-y-4"><div className={`${t.cardBg} border ${t.border} p-4 rounded-3xl shadow-xl`}><div className="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3 mb-4"><div><h3 className={`text-base font-black ${t.textMain}`}>Supplier Purchase Ledger</h3><p className={`text-xs ${t.textMuted}`}>Daily supplier purchases automatically calculate weekly and monthly totals.</p></div><div className="flex flex-wrap gap-2"><button type="button" onClick={()=>setSupplierPeriodFilter('day')} className={`px-3 py-2 rounded-xl text-xs font-bold border ${supplierPeriodFilter==='day'?'bg-blue-600 text-white':'bg-slate-700 text-slate-300'}`}>Today</button><button type="button" onClick={()=>setSupplierPeriodFilter('week')} className={`px-3 py-2 rounded-xl text-xs font-bold border ${supplierPeriodFilter==='week'?'bg-blue-600 text-white':'bg-slate-700 text-slate-300'}`}>This Week</button><button type="button" onClick={()=>setSupplierPeriodFilter('month')} className={`px-3 py-2 rounded-xl text-xs font-bold border ${supplierPeriodFilter==='month'?'bg-blue-600 text-white':'bg-slate-700 text-slate-300'}`}>This Month</button><input type="month" value={supplierMonthFilter} onChange={e=>setSupplierMonthFilter(e.target.value)} className={`px-3 py-2 ${t.inputBg} border rounded-xl text-xs`} /></div></div><div className="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-4"><div className={`${t.cardSecondary} border ${t.border} rounded-2xl p-3`}><div className={`text-xs ${t.textMuted}`}>Purchase Total</div><div className="text-lg font-black text-blue-400">NPR {supplierPeriodPurchaseTotal.toLocaleString()}</div></div><div className={`${t.cardSecondary} border ${t.border} rounded-2xl p-3`}><div className={`text-xs ${t.textMuted}`}>Paid</div><div className="text-lg font-black text-emerald-400">NPR {supplierPeriodPaidTotal.toLocaleString()}</div></div><div className={`${t.cardSecondary} border ${t.border} rounded-2xl p-3`}><div className={`text-xs ${t.textMuted}`}>Supplier Due</div><div className="text-lg font-black text-rose-400">NPR {supplierPeriodDueTotal.toLocaleString()}</div></div></div>{supplierLedgerRows.length===0?<div className={`p-4 rounded-2xl ${t.cardSecondary} ${t.textMuted} text-sm`}>No supplier transactions found for this period.</div>:<div className="overflow-x-auto"><table className="w-full text-sm"><thead className={`${t.tableHeader} border-b`}><tr><th className="p-3 text-left">Supplier</th><th className="p-3 text-right">Purchase</th><th className="p-3 text-right">Paid</th><th className="p-3 text-right">Due</th><th className="p-3 text-right">Entries</th></tr></thead><tbody className={`divide-y ${t.tableDivide}`}>{supplierLedgerRows.map(r=><tr key={r.name}><td className={`p-3 font-bold ${t.textMain}`}>{r.name}<div className={`text-xs ${t.textMuted}`}>{r.phone}</div></td><td className="p-3 text-right font-bold">NPR {r.purchases.toLocaleString()}</td><td className="p-3 text-right text-emerald-400 font-bold">NPR {r.paid.toLocaleString()}</td><td className="p-3 text-right text-rose-400 font-bold">NPR {r.due.toLocaleString()}</td><td className={`p-3 text-right ${t.textMuted}`}>{r.entries}</td></tr>)}</tbody></table></div>}</div></div>\n'''
              if m not in s: raise SystemExit('expense form marker not found')
              s = s.replace(m, ui + m, 1)
          p.write_text(s)
          print('changed:', s != original)
          PY
      - name: Commit application updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then echo "No application changes needed"; else git commit -m "feat: add supplier weekly monthly ledger"; git push; fi
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Production build
        run: npm run build
