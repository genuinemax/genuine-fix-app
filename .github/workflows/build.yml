name: Genuine Fix Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply non-stock POS billing patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/App.jsx')
          s = p.read_text()

          # Remove the old Walk-in buttons if they were injected into the bill-items area.
          s = re.sub(r'\s*<div id="walk-in-bill-actions"[\s\S]*?</div>\s*', '\n', s, count=1)

          # Add a manual/non-stock mode to the FIRST item selector after the Bill Items heading.
          if 'item.nonStock' not in s:
              heading_pos = s.find('Bill Items & Parts Selection')
              if heading_pos < 0:
                  raise SystemExit('Bill Items & Parts Selection heading not found')

              select_start = s.find('<select', heading_pos)
              if select_start < 0:
                  raise SystemExit('POS item selector not found')

              select_end = s.find('</select>', select_start)
              if select_end < 0:
                  raise SystemExit('POS item selector closing tag not found')
              select_end += len('</select>')

              old_select = s[select_start:select_end]
              new_select = '''{item.nonStock ? (
              <input
                type="text"
                value={item.name}
                onChange={e => {
                  const nextItems = [...posBill.items];
                  nextItems[idx].name = e.target.value;
                  setPosBill({ ...posBill, items: nextItems });
                }}
                placeholder="Non-stock item / service name"
                className={`flex-1 p-3 ${t.inputBg} border rounded-2xl text-sm focus:outline-none`}
                required
              />
            ) : (
              ''' + old_select + '''
            )}
            <button
              type="button"
              onClick={() => {
                const nextItems = [...posBill.items];
                nextItems[idx].nonStock = !nextItems[idx].nonStock;
                if (nextItems[idx].nonStock) {
                  nextItems[idx].name = '';
                  nextItems[idx].price = '';
                }
                setPosBill({ ...posBill, items: nextItems });
              }}
              className={`px-3 py-2 rounded-xl text-xs font-black border transition ${item.nonStock ? 'bg-blue-600/20 text-blue-400 border-blue-500/30' : 'bg-amber-600/20 text-amber-400 border-amber-500/30'}`}
            >
              {item.nonStock ? 'Stock Item' : 'Non-stock'}
            </button>'''
              s = s[:select_start] + new_select + s[select_end:]

          # Non-stock lines have no inventory record, so don't reject them as missing stock.
          s, changed = re.subn(
              r'if\s*\(!invItem\s*\|\|\s*invItem\.stock\s*<\s*item\.qty\)',
              'if (invItem && invItem.stock < item.qty)',
              s,
              count=1
          )
          if changed == 0:
              raise SystemExit('POS stock validation pattern not found')

          # Make new rows explicit, while preserving old rows that don't have the flag.
          s = s.replace("items: [{ name: '', price: '', qty: 1 }]", "items: [{ name: '', price: '', qty: 1, nonStock: false }]", 1)
          s = s.replace("items: [...posBill.items, { name: '', price: '', qty: 1 }]", "items: [...posBill.items, { name: '', price: '', qty: 1, nonStock: false }]", 1)

          p.write_text(s)
          PY

      - name: Commit non-stock POS patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No non-stock POS changes needed"
          else
            git commit -m "feat: allow billing non-stock POS items"
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
