name: Genuine Fix Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply non-stock POS billing patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('src/App.jsx')
          s = p.read_text()

          # Remove the earlier Walk-in UI injection. Walk-in should remain a customer value,
          # not replace the item/customer-name field. Billing non-stock goods is a separate feature.
          s = re.sub(r'\s*<div id="walk-in-bill-actions"[\s\S]*?</div>\s*', '\n', s, count=1)

          # Add a per-line non-stock/manual mode to the POS item list.
          if 'item.nonStock' not in s:
              old = """<select
                        value={item.name}
                        onChange={e => {
                          const val = e.target.value;
                          const invItem = inventory.find(i => i.name === val);
                          const nextItems = [...posBill.items];
                          nextItems[idx].name = val;
                          if (invItem) nextItems[idx].price = invItem.price;
                          setPosBill({ ...posBill, items: nextItems });
                        }}
                        className={`flex-1 p-3 ${t.inputBg} border rounded-2xl text-sm focus:outline-none`}
                        required
                      >
                        <option value="">Select stock item or accessory...</option>
                        {inventory.map(inv => (
                          <option key={inv.id} value={inv.name}>{inv.name} (Stock: {inv.stock} — NPR {inv.price})</option>
                        ))}
                      </select>"""

              new = """{item.nonStock ? (
                        <input
                          type=\"text\"
                          value={item.name}
                          onChange={e => {
                            const nextItems = [...posBill.items];
                            nextItems[idx].name = e.target.value;
                            setPosBill({ ...posBill, items: nextItems });
                          }}
                          placeholder=\"Non-stock item / service name\"
                          className={`flex-1 p-3 ${t.inputBg} border rounded-2xl text-sm focus:outline-none`}
                          required
                        />
                      ) : (
                        <select
                          value={item.name}
                          onChange={e => {
                            const val = e.target.value;
                            const invItem = inventory.find(i => i.name === val);
                            const nextItems = [...posBill.items];
                            nextItems[idx].name = val;
                            if (invItem) nextItems[idx].price = invItem.price;
                            setPosBill({ ...posBill, items: nextItems });
                          }}
                          className={`flex-1 p-3 ${t.inputBg} border rounded-2xl text-sm focus:outline-none`}
                          required
                        >
                          <option value=\"\">Select stock item or accessory...</option>
                          {inventory.map(inv => (
                            <option key={inv.id} value={inv.name}>{inv.name} (Stock: {inv.stock} — NPR {inv.price})</option>
                          ))}
                        </select>
                      )}
                      <button
                        type=\"button\"
                        onClick={() => {
                          const nextItems = [...posBill.items];
                          nextItems[idx].nonStock = !nextItems[idx].nonStock;
                          if (nextItems[idx].nonStock) nextItems[idx].name = '';
                          setPosBill({ ...posBill, items: nextItems });
                        }}
                        className={`px-3 py-2 rounded-xl text-xs font-black border transition ${item.nonStock ? 'bg-amber-600/20 text-amber-400 border-amber-500/30' : 'bg-slate-700/30 text-slate-400 border-slate-600'}`}
                      >
                        {item.nonStock ? 'Stock Item' : 'Non-stock'}
                      </button>"""

              if old not in s:
                  raise SystemExit('POS item select block not found')
              s = s.replace(old, new, 1)

          # Permit non-stock lines: only existing inventory items are stock-checked/deducted.
          # Existing stock items keep the same insufficient-stock validation.
          s, changed = re.subn(r'if \(!invItem \|\| invItem\.stock < item\.qty\)', 'if (invItem && invItem.stock < item.qty)', s, count=1)
          if changed == 0:
              raise SystemExit('POS stock validation pattern not found')

          # New POS lines explicitly carry the non-stock flag for predictable state.
          s = s.replace("items: [{ name: '', price: '', qty: 1 }]", "items: [{ name: '', price: '', qty: 1, nonStock: false }]", 1)
          s = s.replace("items: [...posBill.items, { name: '', price: '', qty: 1 }]", "items: [...posBill.items, { name: '', price: '', qty: 1, nonStock: false }]", 1)

          p.write_text(s)
          PY

      - name: Commit non-stock POS patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx
          if git diff --cached --quiet; then
            echo "No non-stock POS changes needed"
          else
            git commit -m "feat: allow billing non-stock POS items"
            git push
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build
