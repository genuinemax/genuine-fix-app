name: Apply Walk-in Bill Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'feat: add walk-in customer billing to POS'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch POS bill UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()

          old = '''                <CustomerAutocomplete\n                  value={posBill.customerName}\n                  placeholder="Customer Full Name"\n                  customers={uniqueCustomers}\n                  onChange={value => setPosBill(prev => ({ ...prev, customerName: value }))}\n                  onSelect={customer => handleCustomerSelect(customer, 'pos')}\n                  className={`w-full p-3 ${t.inputBg} border rounded-2xl text-sm focus:outline-none`}\n                />'''
          new = '''                <div className="flex gap-2">\n                  <div className="flex-1">\n                    <CustomerAutocomplete\n                      value={posBill.customerName}\n                      placeholder="Customer Full Name"\n                      customers={uniqueCustomers}\n                      onChange={value => setPosBill(prev => ({ ...prev, customerName: value }))}\n                      onSelect={customer => handleCustomerSelect(customer, 'pos')}\n                      className={`w-full p-3 ${t.inputBg} border rounded-2xl text-sm focus:outline-none`}\n                    />\n                  </div>\n                  <button\n                    type="button"\n                    onClick={() => setPosBill(prev => ({ ...prev, customerName: 'Walk-in Customer', phone: '' }))}\n                    className="shrink-0 px-4 rounded-2xl bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-600/30 text-xs font-black transition"\n                    title="Use Walk-in Customer"\n                  >\n                    Walk-in\n                  </button>\n                </div>'''
          if old not in s:
              raise SystemExit('POS customer field pattern not found')
          s = s.replace(old, new, 1)

          old2 = """              <button type=\"submit\" className=\"w-full bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl p-3.5 transition shadow-lg shadow-blue-600/35\">Complete POS Bill & Deduct Stock</button>"""
          new2 = """              <div className=\"flex gap-3\">\n                <button type=\"button\" onClick={() => setPosBill({ customerName: 'Walk-in Customer', phone: '', items: [{ name: '', price: '', qty: 1 }], paidAmount: '', warrantyMonths: '' })} className=\"px-5 bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-600/30 font-bold rounded-2xl p-3.5 transition\">Walk-in Bill</button>\n                <button type=\"submit\" className=\"flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl p-3.5 transition shadow-lg shadow-blue-600/35\">Complete POS Bill & Deduct Stock</button>\n              </div>"""
          if old2 not in s:
              raise SystemExit('POS submit button pattern not found')
          s = s.replace(old2, new2, 1)

          p.write_text(s)
          PY

      - name: Commit app fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-walkin-bill-fix.yml
          git add src/App.jsx .github/workflows/apply-walkin-bill-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "feat: add walk-in customer billing to POS"
          git push
