name: Fix inventory history and notes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch App.jsx
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.jsx')
          s = p.read_text()

          old = '''                onChange={e => setNewPart({...newPart, notes: normalizePartsStockNotes(e.target.value)})}\n                onPaste={e => {'''
          new = '''                onChange={e => setNewPart({...newPart, notes: e.target.value})}\n                onBlur={e => setNewPart(prev => ({...prev, notes: normalizePartsStockNotes(e.target.value)}))}\n                onPaste={e => {'''
          if old not in s:
              raise SystemExit('Notes textarea pattern not found')
          s = s.replace(old, new, 1)

          marker = '''      {/* INVOICE PREVIEW MODAL */}'''
          modal = r'''      {/* EDIT STOCK PURCHASE HISTORY MODAL */}
      {editingStockPurchaseId && (
        <div className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto">
          <div className={`${t.cardBg} border ${t.border} rounded-3xl max-w-2xl w-full p-6 shadow-2xl relative my-8`}>
            <div className="flex items-center justify-between border-b pb-4 border-slate-700/50 mb-5">
              <div>
                <p className={`text-xs uppercase tracking-[0.2em] font-black ${t.textMuted}`}>Inventory</p>
                <h3 className={`text-xl font-black ${t.textMain}`}>Edit Purchase History</h3>
                <p className={`text-xs ${t.textMuted} mt-1`}>Update the history record without changing current stock.</p>
              </div>
              <button type="button" onClick={() => {
                setEditingStockPurchaseId(null);
                setNewStockPurchase({ partId: '', partName: '', category: categories[0] || 'Mobile Parts', supplierName: '', supplierPhone: '', qty: '', unitCost: '', date: todayKey, invoiceNo: '', notes: '', paymentMethod: 'Cash' });
              }} className="p-2 rounded-xl bg-slate-800 text-slate-400 hover:text-white"><X size={18}/></button>
            </div>

            <form onSubmit={handleAddStockPurchase} className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <input type="date" value={newStockPurchase.date || ''} onChange={e => setNewStockPurchase(prev => ({...prev, date: e.target.value}))} className={`p-3 ${t.inputBg} border rounded-2xl text-sm focus:outline-none`} required />
              <select value={newStockPurchase.partId || ''} onChange={e => {
                const part = inventory.find(i => String(i.id) === String(e.target.value));
                setNewStockPurchase(prev => ({...prev, partId: e.target.value, partName: part?.name || prev.partName, category: part?.category || prev.category}));
              }} className={`p-3 ${t.inputBg} border rounded-2xl text-sm focus:outline-none`}>
                <option value="">Keep / enter item name below</option>
                {inventory.map(item => <option key={item.id} value={item.id}>{item.name}</option>)}
              </select>
              <input type="text" placeholder="Part / Item Name" value={newStockPurchase.partName || ''} onChange={e => setNewStockPurchase(prev => ({...prev, partName: e.target.value}))} className={`p-3 ${t.inputBg} border rounded-2xl text-sm focus:outline-none`} required />
              <select value={newStockPurchase.category || categories[0] || ''} onChange={e => setNewStockPurchase(prev => ({...prev, category: e.target.value}))} className={`p-3 ${t.inputBg} border rounded-2xl text-sm focus:outline-none`}>
                {categories.map(cat => <option key={cat} value={cat}>{cat}</option>)}
              </select>
              <input type="text" placeholder="Supplier Name" value={newStockPurchase.supplierName || ''} onChange={e => setNewStockPurchase(prev => ({...prev, supplierName: e.target.value}))} className={`p-3 ${t.inputBg} border rounded-2xl text-sm focus:outline-none`} />
              <input type="text" placeholder="Supplier Phone" value={newStockPurchase.supplierPhone || ''} onChange={e => setNewStockPurchase(prev => ({...prev, supplierPhone: e.target.value}))} className={`p-3 ${t.inputBg} border rounded-2xl text-sm focus:outline-none`} />
              <input type="number" min="0.01" step="0.01" placeholder="Quantity" value={newStockPurchase.qty ?? ''} onChange={e => setNewStockPurchase(prev => ({...prev, qty: e.target.value}))} className={`p-3 ${t.inputBg} border rounded-2xl text-sm focus:outline-none`} required />
              <input type="number" min="0" step="0.01" placeholder="Unit Cost (NPR)" value={newStockPurchase.unitCost ?? ''} onChange={e => setNewStockPurchase(prev => ({...prev, unitCost: e.target.value}))} className={`p-3 ${t.inputBg} border rounded-2xl text-sm focus:outline-none`} required />
              <input type="text" placeholder="Invoice Number" value={newStockPurchase.invoiceNo || ''} onChange={e => setNewStockPurchase(prev => ({...prev, invoiceNo: e.target.value}))} className={`p-3 ${t.inputBg} border rounded-2xl text-sm focus:outline-none`} />
              <select value={newStockPurchase.paymentMethod || 'Cash'} onChange={e => setNewStockPurchase(prev => ({...prev, paymentMethod: e.target.value}))} className={`p-3 ${t.inputBg} border rounded-2xl text-sm focus:outline-none`}>
                <option value="Cash">Cash</option>
                <option value="Bank">Bank</option>
                <option value="eSewa">eSewa</option>
                <option value="Khalti">Khalti</option>
                <option value="Credit / Udhaaro">Credit / Udhaaro</option>
              </select>
              <textarea rows="4" placeholder="Notes / Remarks" value={newStockPurchase.notes || ''} onChange={e => setNewStockPurchase(prev => ({...prev, notes: e.target.value}))} className={`md:col-span-2 p-3 ${t.inputBg} border rounded-2xl text-sm focus:outline-none resize-y leading-6`} />

              <div className={`md:col-span-2 ${t.cardSecondary} border ${t.border} rounded-2xl p-4 flex items-center justify-between gap-3`}>
                <div>
                  <div className={`text-xs uppercase tracking-wide font-black ${t.textMuted}`}>Updated Purchase Total</div>
                  <div className={`text-xl font-black ${t.textMain}`}>NPR {(Number(newStockPurchase.qty || 0) * Number(newStockPurchase.unitCost || 0)).toLocaleString()}</div>
                </div>
                <span className="text-xs font-bold text-amber-400">History only</span>
              </div>

              <div className="md:col-span-2 flex gap-3 pt-1">
                <button type="submit" className="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl p-3.5 transition shadow-lg shadow-blue-600/30">Save Changes</button>
                <button type="button" onClick={() => {
                  setEditingStockPurchaseId(null);
                  setNewStockPurchase({ partId: '', partName: '', category: categories[0] || 'Mobile Parts', supplierName: '', supplierPhone: '', qty: '', unitCost: '', date: todayKey, invoiceNo: '', notes: '', paymentMethod: 'Cash' });
                }} className="px-6 bg-slate-700 hover:bg-slate-600 text-white font-bold rounded-2xl p-3.5 transition">Cancel</button>
              </div>
            </form>
          </div>
        </div>
      )}

'''
          if marker not in s:
              raise SystemExit('Invoice modal marker not found')
          s = s.replace(marker, modal + marker, 1)

          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.jsx
          git commit -m 'Fix inventory history editing and notes spaces' || true
          git push

          rm -f .github/workflows/fix-inventory-notes.yml
          git add .github/workflows/fix-inventory-notes.yml
          git commit -m 'Remove temporary fix workflow' || true
          git push
